
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="balloons">
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
        <div class="balloon">🎈</div>
    </div>

    <div class="container">

        <div class="cake">🎂</div>

        <h1>Happy Birthday!</h1>

        <h2 id="name">Dear Best Friend ❤️</h2>

        <p class="message">
            Today is your special day! 🥳
            May your life be filled with happiness,
            love, laughter and endless beautiful memories.
            Keep smiling and shining always!
        </p>

        <button onclick="celebrate()">
            🎉 Celebrate Now
        </button>

        <div class="gift" onclick="openGift()">
            🎁
            <p>Click to open your gift!</p>
        </div>

        <h3 id="surprise"></h3>

        <p class="footer">
            Made with ❤️ just for you!
        </p>

    </div>

    <canvas id="confetti"></canvas>

    <script src="script.js"></script>
</body>
</html>
